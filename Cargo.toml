[package]
name = "kohaku"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "A tiny, self-hosted bug report inbox"
repository = "https://github.com/Dakes/Kohaku"
publish = false

[features]
# Development-only behaviour; a release build with it fails to compile (src/lib.rs).
dev = []

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

# The mail worker catches a panic per delivery attempt, which needs unwinding.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
