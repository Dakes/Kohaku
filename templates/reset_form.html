{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
{%- if let Some(error) = error %}
<p class="error" role="alert">{{ error }}</p>
{%- endif %}
<form method="post" action="/admin/reset/{{ token }}" class="stacked">
<label for="password">New password (at least 12 characters)</label>
<input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024">
<label for="password_again">New password again</label>
<input id="password_again" name="password_again" type="password" autocomplete="new-password" required minlength="12" maxlength="1024">
<button type="submit">Set the password</button>
</form>
{% endblock %}
