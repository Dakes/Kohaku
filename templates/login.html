{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{%- if failed %}
<p class="error" role="alert">The sign-in failed. Check your email address, password and code, then try again.</p>
{%- endif %}
<form method="post" action="/admin/login" class="stacked">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<label for="code">Code from your authenticator app, or a recovery code</label>
<input id="code" name="code" autocomplete="one-time-code" maxlength="32">
<button type="submit">Sign in</button>
</form>
<p><a href="/admin/reset">Forgot your password?</a></p>
{% endblock %}
