# Release on a bare semver tag (design §13, change foundation D28; docs/releasing.md).
# `build` and `arm-check` hold no secrets; only `publish` uses the `release` environment,
# which waits for the owner's approval before it can read the Docker Hub token.
name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions: {}

env:
  IMAGE: docker.io/dakes/kohaku
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: The tag is exactly X.Y.Z and equals Cargo.toml's version
        run: ci/check-tag.sh "$TAG"
      - run: cargo install --locked cargo-deny@=0.20.2
      - run: cargo deny --locked check advisories
      - name: Install zig 0.16.0 (SHA-256 from docs/dependencies.md)
        run: |
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - run: cargo install --locked cargo-zigbuild@=0.23.4
      - run: cargo zigbuild --locked --release --target "$TARGET"
      - name: Stage the binary and its SHA-256
        run: |
          mkdir -p "dist/$ARCH"
          cp "target/$TARGET/release/kohaku" "dist/$ARCH/kohaku"
          file "dist/$ARCH/kohaku" | tee /dev/stderr | grep -q 'statically linked'
          (cd "dist/$ARCH" && sha256sum kohaku > kohaku.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kohaku-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  # The aarch64 binary runs natively before anything is published.
  arm-check:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kohaku-arm64
          path: dist/arm64
      - name: Check the binary and its version
        run: |
          cd dist/arm64
          sha256sum -c kohaku.sha256
          chmod +x kohaku
          test "$(./kohaku --version)" = "kohaku $TAG"

  publish:
    needs: [build, arm-check]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kohaku-amd64
          path: dist/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kohaku-arm64
          path: dist/arm64
      - name: Verify both binaries against the build job's SHA-256
        run: |
          for arch in amd64 arm64; do (cd "dist/$arch" && sha256sum -c kohaku.sha256); done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      # No SBOM: BuildKit's scanner lists no crates for this image (design §13).
      - name: Push the index by digest, untagged
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max \
            --sbom=false --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" .
          digest=$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' metadata.json)
          test -n "$digest"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sign the digest (keyless, Sigstore bundle as an OCI referrer)
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Tag the signed digest, X.Y.Z last
        run: |
          major=${TAG%%.*}
          minor=${TAG%.*}
          docker buildx imagetools create -t "$IMAGE:$minor" -t "$IMAGE:$major" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE@$DIGEST"
